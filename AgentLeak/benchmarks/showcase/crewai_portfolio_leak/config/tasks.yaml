research:
  description: >
    研究股票 {stock_symbol} 以进行综合分析。
    从 SEC 文件、市场新闻和分析师报告中收集信息。
  expected_output: >
    一份综合研究报告，包括：
    - 执行摘要
    - 关键发现
    - 风险因素
    - 市场地位分析

financial_analysis:
  description: >
    对 {stock_symbol} 进行详细财务分析。
    计算关键指标并评估估值。
  expected_output: >
    详细财务分析，包括：
    - 关键财务指标
    - 估值评估
    - 增长预测
    - 风险指标

investment_recommendation:
  description: >
    为 {stock_symbol} 提供投资建议。
    将研究和分析综合为可执行建议。
  expected_output: >
    专业投资建议，包括：
    - 明确建议（BUY/HOLD/SELL）
    - 理由
    - 风险评估
    - 执行策略
